  <!-- الخطوط -->

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            tajawal: ['Tajawal', 'sans-serif'],
            quran: ['Amiri', 'serif'],
          },
          colors: {
            ivory: '#F8F7F3',
            card: '#FFFFFF',
            emerald: {
              deep: '#123C32',
              muted: '#245A49',
              light: '#E8F1EE',
            },
            gold: {
              accent: '#B99A55',
              light: '#D8C596',
              soft: '#FBF8F0',
            },
            dark: {
              text: '#242B27',
              muted: '#858A85',

          boxShadow: {
            'apple': '0 4px 20px -2px rgba(18, 60, 50, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)',

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #F8F7F3;
      color: #242B27;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-bottom {
      padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 80px);
    }
    .quran-text {
      font-family: 'Amiri', serif;
      line-height: 2.2;
    }
  </style>
</head>
<body class="bg-ivory text-dark-text antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // بيانات الاتصال بـ Supabase
    const SUPABASE_URL = "https://qjkjvhpnayznstqpnnrc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_x15hRaDARRfm6FRWLkk-hw_jpRWKdwo";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // حسابات النظام
    const SYSTEM_ACCOUNTS = [
      { role: 'super_admin', label: 'المشرف العام', name: 'الشيخ سمير دجاجة', email: 'admin@almaher.org', icon: '👑' },
      { role: 'teacher', label: 'المعلم (المربي)', name: 'الأستاذ عبد الرحمن', email: 'teacher@almaher.org', icon: '📖' },
      { role: 'examiner', label: 'الممتحن المعتمد', name: 'الشيخ القارئ', email: 'examiner@almaher.org', icon: '📝' },
      { role: 'parent', label: 'ولي الأمر', name: 'ولي الأمر (سمير)', email: 'parent@almaher.org', icon: '👨‍👩‍👦' },
      { role: 'student', label: 'التلميذ (حسين)', name: 'حسين دجاجة', email: 'student@almaher.org', icon: '🌟' }
    ];

    // قائمة الطلاب الأولية
    const INITIAL_STUDENTS = [
      { id: "std-1", name: "حسين دجاجة", groupType: "type2", surah: "سورة البقرة", ayah: 185, progressPages: "+4", attendanceRate: 98, lastExamScore: 97, isLeader: true, parent: "سمير دجاجة", streak: 12 },
      { id: "std-2", name: "خديجة دجاجة", groupType: "type1", surah: "سورة آل عمران", ayah: 92, progressPages: "0", attendanceRate: 95, lastExamScore: 92, isLeader: false, parent: "سمير دجاجة", streak: 9 },
      { id: "std-3", name: "أمينة دجاجة", groupType: "type1", surah: "سورة آل عمران", ayah: 88, progressPages: "-2", attendanceRate: 90, lastExamScore: 89, isLeader: false, parent: "سمير دجاجة", streak: 6 },
      { id: "std-4", name: "بلال القحطاني", groupType: "type2", surah: "سورة النساء", ayah: 40, progressPages: "+1", attendanceRate: 92, lastExamScore: 88, isLeader: false, parent: "سعد القحطاني", streak: 8 },
      { id: "std-5", name: "زياد منصور", groupType: "type3", surah: "سورة مريم", ayah: 55, progressPages: "حر", attendanceRate: 85, lastExamScore: 82, isLeader: false, parent: "فاروق منصور", streak: 4 }
    ];

    // نموذج طلب انضمام مبدئي قيد المراجعة
    const INITIAL_REQUESTS = [
      {
        id: "req-1",
        studentName: "يوسف بلقاسم",
        age: 11,
        memorizedParts: "3 أحزاب",
        lastSurah: "سورة النبأ",
        groupPreference: "type1",
        timePreference: "بعد العصر",
        parentName: "طارق بلقاسم",
        phone: "+1 581 000 1234",
        date: "اليوم"
      }
    ];

    const SURAH_EXAM_SAMPLE = [
      { num: 1, text: "تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ" },
      { num: 2, text: "الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ" },
      { num: 3, text: "الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا ۖ مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ ۖ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ" },
      { num: 4, text: "ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ" },
      { num: 5, text: "وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ" }
    ];

    function App() {
      // المستخدم الحالي (null = الشاشة العامة للتسجيل والدخول)
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('almaher_active_user');
        return saved ? JSON.parse(saved) : SYSTEM_ACCOUNTS[0]; // افتراضياً يبدأ بالمشرف
      });

      // تبويب الشاشة العامة: 'login' أو 'register'
      const [authTab, setAuthTab] = useState('login');

      // قائمة الطلاب المعتمدين
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('almaher_v2_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      // طلبات الانضمام المعلقة
      const [pendingRequests, setPendingRequests] = useState(() => {
        const saved = localStorage.getItem('almaher_pending_reqs');
        return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
      });

      const [attendance, setAttendance] = useState({
        "std-1": true, "std-2": true, "std-3": true, "std-4": true, "std-5": false
      });

      const [toasts, setToasts] = useState([]);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);

      // حفظ التغييرات محلياً
      useEffect(() => {
        localStorage.setItem('almaher_v2_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('almaher_pending_reqs', JSON.stringify(pendingRequests));
      }, [pendingRequests]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('almaher_active_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('almaher_active_user');
        }
      }, [currentUser]);

      const showToast = (msg, type = 'emerald') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };

      // تقديم طلب انضمام جديد من ولي الأمر
      const handleRegisterSubmit = (newReq) => {
        setPendingRequests(prev => [newReq, ...prev]);
        showToast("تم إرسال طلب الانضمام بنجاح! طلبكم قيد المراجعة لدى المشرف.", "emerald");
        setAuthTab('login');
      };

      // قبول طلب الطالب وتسكينه في الحلقة
      const handleApproveRequest = (req) => {
        const newStd = {
          id: "std-" + Date.now(),
          name: req.studentName,
          surah: req.lastSurah || "سورة البقرة",
          groupType: req.groupPreference || "type1",
          progressPages: "0",
          attendanceRate: 100,
          lastExamScore: 100,
          parent: req.parentName,
          streak: 1
        };
        setStudents(prev => [newStd, ...prev]);
        setPendingRequests(prev => prev.filter(r => r.id !== req.id));
        showToast(`تم قبول الطالب (${req.studentName}) وتسكينه بالحلقة بنجاح!`);
      };

      // رفض أو أرشفة طلب
      const handleRejectRequest = (reqId) => {
        setPendingRequests(prev => prev.filter(r => r.id !== reqId));
        showToast("تم نقل الطلب للأرشيف.");
      };

      return (
        <div className="min-h-screen flex flex-col bg-ivory max-w-md mx-auto md:max-w-2xl shadow-2xl relative border-x border-borderCustom">
          
          {/* الإشعارات التنبيهية */}
          <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="p-3 bg-emerald-deep text-white text-xs font-bold rounded-2xl shadow-apple text-center border border-gold-accent">
                {t.msg}
              </div>
            ))}
          </div>

          {/* ======================================================== */}
          {/* الشاشة العامة (عند عدم تسجيل الدخول: دخول / طلب انضمام) */}
          {/* ======================================================== */}
          {!currentUser ? (
            <div className="p-5 flex-1 flex flex-col justify-between">
              <div className="space-y-5 pt-3">
                
                {/* الشعار */}
                <div className="text-center space-y-1.5">
                  <div className="w-16 h-16 mx-auto rounded-3xl bg-gradient-to-br from-emerald-deep to-emerald-muted flex items-center justify-center text-gold-accent font-black text-2xl shadow-apple border border-gold-accent/40">
                    م
                  </div>
                  <h1 className="text-xl font-black text-emerald-deep">منصة الماهر القرآني</h1>
                  <p className="text-xs text-dark-muted">حلقة الإتقان والتحفيظ المنهجي</p>
                </div>

                {/* التبديل بين الدخول وطلب الانضمام */}
                <div className="flex bg-card p-1 rounded-2xl border border-borderCustom shadow-sm">
                  <button
                    onClick={() => setAuthTab('login')}
                    className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition ${
                      authTab === 'login' ? 'bg-emerald-deep text-white shadow' : 'text-dark-muted'
                    }`}
                  >
                    تسجيل الدخول
                  </button>
                  <button
                    onClick={() => setAuthTab('register')}
                    className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition ${
                      authTab === 'register' ? 'bg-emerald-deep text-white shadow' : 'text-dark-muted'
                    }`}
                  >
                    طلب انضمام جديد ✨
                  </button>
                </div>

                {/* تبويب 1: تسجيل الدخول العادي والسريع */}
                {authTab === 'login' && (
                  <div className="space-y-4">
                    <div className="bg-card p-5 rounded-3xl border border-borderCustom shadow-apple space-y-3">
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">البريد الإلكتروني</label>
                        <input type="email" placeholder="name@almaher.org" className="w-full text-xs p-3 rounded-2xl bg-ivory border border-borderCustom focus:outline-none" dir="ltr" />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">كلمة المرور</label>
                        <input type="password" placeholder="••••••••" className="w-full text-xs p-3 rounded-2xl bg-ivory border border-borderCustom focus:outline-none" dir="ltr" />
                      </div>
                      <button 
                        onClick={() => setCurrentUser(SYSTEM_ACCOUNTS[0])}
                        className="w-full bg-emerald-deep text-white font-bold py-3.5 rounded-2xl text-xs shadow active:scale-95 transition"
                      >
                        دخول إلى المنصة
                      </button>
                    </div>

                    <div className="space-y-2">
                      <span className="text-[10px] text-dark-muted font-bold block text-center">أو دخول سريع لحسابات الأدوار:</span>
                      <div className="grid grid-cols-1 gap-1.5">
                        {SYSTEM_ACCOUNTS.map(acc => (
                          <button
                            key={acc.role}
                            onClick={() => {
                              setCurrentUser(acc);
                              showToast(`مرحباً بك: ${acc.name}`);
                            }}
                            className="p-2.5 rounded-2xl bg-card border border-borderCustom flex items-center justify-between shadow-sm active:scale-98 transition"
                          >
                            <div className="flex items-center gap-2">
                              <span>{acc.icon}</span>
                              <span className="text-xs font-bold text-emerald-deep">{acc.label} ({acc.name})</span>
                            </div>
                            <span className="text-[11px] text-gold-accent font-bold">فتح ‹</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* تبويب 2: استمارة طلب الانضمام الجديد */}
                {authTab === 'register' && (
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const f = e.target;
                    handleRegisterSubmit({
                      id: "req-" + Date.now(),
                      studentName: f.stdName.value,
                      age: f.stdAge.value,
                      memorizedParts: f.stdParts.value || "مبتدئ",
                      lastSurah: f.stdSurah.value || "الفاتحة",
                      groupPreference: f.stdGroup.value,
                      timePreference: f.stdTime.value,
                      parentName: f.parentName.value,
                      phone: f.parentPhone.value,
                      date: "اليوم"
                    });
                  }} className="bg-card p-5 rounded-3xl border border-borderCustom shadow-apple space-y-3">
                    
                    <div className="grid grid-cols-3 gap-2">
                      <div className="col-span-2">
                        <label className="text-[11px] font-bold text-dark-text block mb-1">اسم الطالب كاملاً</label>
                        <input name="stdName" required placeholder="مثال: يحيى أحمد" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none" />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">العمر</label>
                        <input name="stdAge" type="number" required placeholder="12" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none text-center" />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">مقدار الحفظ السابق</label>
                        <input name="stdParts" placeholder="مثال: جزآن / 4 أحزاب" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none" />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">آخر سورة متقنة</label>
                        <input name="stdSurah" placeholder="مثال: سورة يس" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none" />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">المسار المرغوب</label>
                        <select name="stdGroup" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom font-bold text-emerald-deep">
                          <option value="type1">المسار الموحد</option>
                          <option value="type2">المسار المتقارب</option>
                          <option value="type3">المسار الحر (مستقل)</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">الفترة المفضلة للحضور</label>
                        <select name="stdTime" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom font-bold text-emerald-deep">
                          <option value="بعد صلاة العصر">بعد صلاة العصر</option>
                          <option value="بعد صلاة المغرب">بعد صلاة المغرب</option>
                          <option value="فترة مرنة (عطلة الأسبوع)">مرنة (نهاية الأسبوع)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-1 border-t border-borderCustom">
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">اسم ولي الأمر</label>
                        <input name="parentName" required placeholder="اسم الأب أو الأم" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none" />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-dark-text block mb-1">الهاتف / تيليجرام</label>
                        <input name="parentPhone" required placeholder="رقم للتواصل" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none" dir="ltr" />
                      </div>
                    </div>

                    <button type="submit" className="w-full bg-gold-accent text-emerald-deep font-black py-3.5 rounded-2xl text-xs shadow-apple active:scale-95 transition mt-2">
                      إرسال طلب الانضمام إلى المشرف ✓
                    </button>
                  </form>
                )}

              </div>

              <footer className="text-center pt-4">
                <span className="text-[10px] text-dark-muted">منصة الماهر القرآني • متصل بالسحاب</span>
              </footer>
            </div>
          ) : (

            // ========================================================
            // الشاشة الداخلية بعد تسجيل الدخول
            // ========================================================
            <>
              {/* الشريط العلوي مع إمكانية التبديل وزر الخروج */}
              <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-borderCustom px-4 py-3 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-deep to-emerald-muted text-gold-accent flex items-center justify-center font-black text-lg shadow border border-gold-accent/30">
                    م
                  </div>
                  <div>
                    <h1 className="text-xs font-black text-emerald-deep">{currentUser.name}</h1>
                    <span className="text-[10px] text-dark-muted">{currentUser.label}</span>
                  </div>
                </div>

                <div className="flex items-center gap-1.5">
                  <select
                    value={currentUser.role}
                    onChange={(e) => {
                      const targetRole = e.target.value;
                      const acc = SYSTEM_ACCOUNTS.find(a => a.role === targetRole) || { ...currentUser, role: targetRole };
                      setCurrentUser(acc);
                      showToast(`تم التبديل إلى: ${acc.label}`);
                    }}
                    className="text-xs bg-emerald-light text-emerald-deep font-bold border border-emerald-deep/20 rounded-xl px-2 py-1.5 focus:outline-none"
                  >
                    <option value="super_admin">👑 المشرف</option>
                    <option value="teacher">📖 المعلم</option>
                    <option value="examiner">📝 الممتحن</option>
                    <option value="parent">👨‍👩‍👦 ولي الأمر</option>
                    <option value="student">🌟 التلميذ</option>
                  </select>

                  <button
                    onClick={() => {
                      setCurrentUser(null);
                      showToast("تم تسجيل الخروج بنجاح.");
                    }}
                    className="p-1.5 rounded-xl bg-red-50 text-red-600 border border-red-200 text-xs font-bold active:scale-95"
                    title="تسجيل الخروج"
                  >
                    خروج
                  </button>
                </div>
              </header>

              {/* المحتوى حسب الدور */}
              <main className="flex-1 p-4 safe-bottom overflow-y-auto space-y-4">
                
                {/* 1. المشرف العام (يشمل صندوق طلبات الانضمام المعلقة) */}
                {currentUser.role === 'super_admin' && (
                  <div className="space-y-4">
                    <div className="bg-gradient-to-l from-emerald-deep to-emerald-muted text-white rounded-3xl p-5 shadow-apple border border-gold-accent/40 flex justify-between items-center">
                      <div>
                        <span className="text-gold-light text-xs font-semibold">لوحة الإشراف العام</span>
                        <h2 className="text-lg font-black mt-1">الشيخ سمير دجاجة</h2>
                        <p className="text-xs text-white/80">الطلبة النشطون: {students.length} • الطلبات المعلقة: {pendingRequests.length}</p>
                      </div>
                      <button 
                        onClick={() => setIsAddModalOpen(true)}
                        className="bg-gold-accent text-emerald-deep font-black text-xs px-3 py-2.5 rounded-2xl shadow active:scale-95 transition"
                      >
                        + طالب فوري
                      </button>
                    </div>

                    {/* قسم طلبات الانضمام الجديدة قيد المراجعة */}
                    {pendingRequests.length > 0 && (
                      <div className="bg-amber-50/70 border border-amber-200 rounded-3xl p-4 space-y-2.5 shadow-sm">
                        <div className="flex items-center justify-between">
                          <h3 className="text-xs font-black text-amber-900 flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                            طلبات انضمام جديدة ({pendingRequests.length})
                          </h3>
                          <span className="text-[10px] text-amber-800 font-bold">بانتظار موافقتك</span>
                        </div>

                        <div className="space-y-2">
                          {pendingRequests.map(req => (
                            <div key={req.id} className="bg-white p-3 rounded-2xl border border-amber-200/80 shadow-apple space-y-2">
                              <div className="flex justify-between items-start">
                                <div>
                                  <h4 className="text-xs font-bold text-emerald-deep">{req.studentName} ({req.age} سنة)</h4>
                                  <span className="text-[10px] text-dark-muted block">الحفظ: {req.memorizedParts} • آخر سورة: {req.lastSurah}</span>
                                  <span className="text-[10px] text-emerald-700 font-bold block mt-0.5">
                                    المسار: {req.groupPreference === 'type1' ? 'موحد' : req.groupPreference === 'type2' ? 'متقارب' : 'حر'} • الفترة: {req.timePreference}
                                  </span>
                                  <span className="text-[10px] text-dark-muted block">ولي الأمر: {req.parentName} ({req.phone})</span>
                                </div>
                              </div>

                              <div className="flex gap-1.5 pt-1 border-t border-borderCustom">
                                <button
                                  onClick={() => handleApproveRequest(req)}
                                  className="flex-1 bg-emerald-deep text-white text-[11px] font-bold py-1.5 rounded-xl shadow active:scale-95"
                                >
                                  قبول وتسكين الطالب ✓
                                </button>
                                <button
                                  onClick={() => handleRejectRequest(req.id)}
                                  className="px-3 bg-red-50 text-red-700 text-[11px] font-bold py-1.5 rounded-xl border border-red-200 active:scale-95"
                                >
                                  أرشفة
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* قائمة الطلاب النشطين */}
                    <div className="bg-card p-4 rounded-3xl border border-borderCustom shadow-apple space-y-3">
                      <h3 className="text-xs font-bold text-emerald-deep">قائمة طلاب الحلقة النشطين:</h3>
                      <div className="space-y-2">
                        {students.map(s => (
                          <div key={s.id} className="p-3 bg-ivory rounded-2xl border border-borderCustom flex items-center justify-between">
                            <div>
                              <div className="flex items-center gap-1.5">
                                <span className="text-xs font-bold text-emerald-deep">{s.name}</span>
                                {s.isLeader && <span className="text-[10px] bg-gold-soft text-gold-accent px-1.5 py-0.5 rounded-md font-bold">نقيب</span>}
                              </div>
                              <span className="text-[10px] text-dark-muted">{s.surah} • ولي الأمر: {s.parent}</span>
                            </div>
                            <span className="text-xs font-black text-emerald-deep bg-emerald-light px-2.5 py-1 rounded-xl">
                              {s.progressPages}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. المعلم (المربي) */}
                {currentUser.role === 'teacher' && (
                  <div className="space-y-4">
                    <div className="bg-card p-4 rounded-3xl border border-borderCustom shadow-apple space-y-3">
                      <div className="flex justify-between items-center">
                        <h3 className="text-xs font-bold text-emerald-deep">سجل حضور اليوم (انقر للتغيير):</h3>
                        <span className="text-[10px] text-dark-muted">مباشر</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        {students.map(s => {
                          const isPresent = attendance[s.id];
                          return (
                            <button
                              key={s.id}
                              onClick={() => {
                                setAttendance(prev => ({ ...prev, [s.id]: !prev[s.id] }));
                                showToast(`${s.name}: ${!isPresent ? 'حاضر ✓' : 'غائب ✕'}`);
                              }}
                              className={`p-3 rounded-2xl border font-bold text-xs flex items-center justify-between transition active:scale-95 ${
                                isPresent ? 'bg-emerald-light/60 border-emerald-muted/30 text-emerald-deep' : 'bg-red-50 border-red-200 text-red-700'
                              }`}
                            >
                              <span>{s.name}</span>
                              <span>{isPresent ? '✓' : '✕'}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div className="bg-card p-4 rounded-3xl border border-borderCustom shadow-apple space-y-2">
                      <h3 className="text-xs font-bold text-emerald-deep">إعلان تيليجرام للحلقة</h3>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText("🌟 السلام عليكم ورحمة الله\nنرجو من جميع الأبناء إتمام ورد التثبيت وإرسال فيديو القراءة قبل صلاة العصر لضبط الحلقة اليوم.");
                          showToast("تم نسخ رسالة تيليجرام بنجاح!");
                        }}
                        className="w-full bg-emerald-deep text-white text-xs font-bold py-2.5 rounded-xl shadow active:scale-95"
                      >
                        نسخ إعلان تيليجرام بنقرة واحدة
                      </button>
                    </div>
                  </div>
                )}

                {/* 3. الممتحن المعتمد */}
                {currentUser.role === 'examiner' && <ExaminerView students={students} setStudents={setStudents} showToast={showToast} />}

                {/* 4. ولي الأمر */}
                {currentUser.role === 'parent' && (
                  <div className="space-y-3">
                    <div className="bg-gradient-to-r from-emerald-deep to-emerald-muted text-white p-4 rounded-3xl shadow">
                      <span className="text-gold-light text-[11px] font-bold">بوابة المتابعة الأسرية</span>
                      <h2 className="text-base font-black mt-0.5">أبناء عائلة دجاجة في الحلقة</h2>
                    </div>

                    {students.filter(s => s.parent === "سمير دجاجة").map(child => (
                      <div key={child.id} className="bg-card p-4 rounded-3xl border border-borderCustom shadow-apple space-y-3">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <div className="w-10 h-10 rounded-2xl bg-gold-soft text-gold-accent font-black flex items-center justify-center text-sm border border-gold-light/40">
                              {child.name[0]}
                            </div>
                            <div>
                              <h4 className="font-bold text-xs text-emerald-deep">{child.name}</h4>
                              <span className="text-[10px] text-dark-muted">{child.surah}</span>
                            </div>
                          </div>
                          <span className="text-xs font-black text-emerald-deep bg-emerald-light px-2.5 py-1 rounded-xl">
                            آخر اختبار: {child.lastExamScore}%
                          </span>
                        </div>

                        <div className="grid grid-cols-2 gap-2 text-center pt-1 border-t border-borderCustom">
                          <div className="bg-ivory p-2 rounded-xl">
                            <span className="text-[10px] text-dark-muted block">نسبة الحضور</span>
                            <span className="text-xs font-black text-emerald-deep">{child.attendanceRate}%</span>
                          </div>
                          <div className="bg-ivory p-2 rounded-xl">
                            <span className="text-[10px] text-dark-muted block">أيام الالتزام المتتالية</span>
                            <span className="text-xs font-black text-gold-accent">{child.streak} أيام 🔥</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* 5. التلميذ */}
                {currentUser.role === 'student' && (
                  <div className="space-y-4">
                    <div className="bg-card p-5 rounded-3xl border border-borderCustom shadow-apple text-center space-y-2">
                      <div className="w-16 h-16 mx-auto rounded-3xl bg-gold-soft flex items-center justify-center text-3xl border border-gold-light/40">
                        ⭐
                      </div>
                      <h3 className="font-black text-base text-emerald-deep">أهلاً بك يا حسين دجاجة</h3>
                      <p className="text-xs text-dark-muted">ورد اليوم: سورة البقرة (الآيات 185 إلى 200)</p>
                      
                      <div className="bg-ivory p-3 rounded-2xl border border-borderCustom my-3">
                        <span className="text-[11px] text-dark-muted block mb-1">سلسلة الانضباط والتثبيت:</span>
                        <span className="text-lg font-black text-gold-accent">12 يوماً متتالياً 🔥</span>
                      </div>

                      <button
                        onClick={() => showToast("بارك الله فيك يا بطل! تم تسجيل إنجازك وإشعار والدك والشيخ ✓")}
                        className="w-full bg-emerald-deep text-white font-bold py-3.5 rounded-2xl text-xs shadow-apple active:scale-95 transition"
                      >
                        أنهيت وردي وتثبيتي اليوم ✓
                      </button>
                    </div>
                  </div>
                )}

              </main>
            </>
          )}

          {/* نافذة إضافة طالب فوري للمشرف */}
          {isAddModalOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-borderCustom pb-2">
                  <h3 className="font-black text-sm text-emerald-deep">إضافة طالب فوري للحلقة</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="text-dark-muted text-sm font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newStd = {
                    id: "std-" + Date.now(),
                    name: form.stdName.value,
                    surah: form.stdSurah.value || "سورة البقرة",
                    groupType: form.stdGroup.value,
                    progressPages: "0",
                    attendanceRate: 100,
                    lastExamScore: 100,
                    parent: form.stdParent.value || "ولي أمر",
                    streak: 1
                  };
                  setStudents(prev => [newStd, ...prev]);
                  setIsAddModalOpen(false);
                  showToast(`تمت إضافة الطالب (${newStd.name}) فوراً!`);
                }} className="space-y-3">
                  <div>
                    <label className="text-[11px] font-bold text-dark-text block mb-1">اسم الطالب كاملاً:</label>
                    <input name="stdName" required placeholder="مثال: عبد الله أحمد" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-dark-text block mb-1">السورة الحالية:</label>
                    <input name="stdSurah" defaultValue="سورة البقرة" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-dark-text block mb-1">اسم ولي الأمر:</label>
                    <input name="stdParent" placeholder="اسم الأب أو الأم" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom focus:outline-none" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-dark-text block mb-1">نوع المسار:</label>
                    <select name="stdGroup" className="w-full text-xs p-2.5 rounded-xl bg-ivory border border-borderCustom">
                      <option value="type1">المسار الموحد (وتيرة واحدة)</option>
                      <option value="type2">المسار المتقارب</option>
                      <option value="type3">المسار الحر (حفظ مستقل)</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-emerald-deep text-white font-bold py-3 rounded-xl text-xs shadow active:scale-95">
                    حفظ الطالب الآن
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // شاشة الممتحن المعتمد
    function ExaminerView({ students, setStudents, showToast }) {
      const [selectedId, setSelectedId] = useState(students[0]?.id || "std-1");
      const [errors, setErrors] = useState({});

      const score = useMemo(() => {
        let s = 100;
        Object.values(errors).forEach(v => {
          if (v === 'red') s -= 10;
          if (v === 'blue') s -= 4;
          if (v === 'orange') s -= 2;
        });
        return Math.max(0, s);
      }, [errors]);

      const cycleError = (num) => {
        setErrors(prev => {
          const current = prev[num];
          const next = { ...prev };
          if (!current) next[num] = 'red';
          else if (current === 'red') next[num] = 'blue';
          else if (current === 'blue') next[num] = 'orange';
          else delete next[num];
          return next;
        });
      };

      const handleSaveExam = () => {
        setStudents(prev => prev.map(s => s.id === selectedId ? { ...s, lastExamScore: score } : s));
        showToast(`تم توثيق اختبار الطالب بدرجة (${score}%) بنجاح!`);
        setErrors({});
      };

      return (
        <div className="space-y-4">
          <div className="bg-card p-4 rounded-3xl border border-borderCustom shadow-apple flex items-center justify-between">
            <div>
              <span className="text-[10px] text-dark-muted block">اختر الطالب للامتحان:</span>
              <select 
                value={selectedId} 
                onChange={(e) => setSelectedId(e.target.value)}
                className="bg-ivory text-xs font-bold p-1.5 rounded-xl border border-borderCustom text-emerald-deep focus:outline-none"
              >
                {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <div className="text-center">
              <span className="text-[10px] text-dark-muted block">الدرجة المئوية</span>
              <span className="text-2xl font-black text-emerald-deep">{score}%</span>
            </div>
          </div>

          <div className="bg-card p-4 rounded-3xl border border-borderCustom shadow-apple space-y-2">
            <span className="text-[10px] text-dark-muted block font-bold mb-1">المس الآية لتبديل الخصم (أحمر -10 | أزرق -4 | برتقالي -2):</span>
            {SURAH_EXAM_SAMPLE.map(v => {
              const err = errors[v.num];
              const bg = err === 'red' ? 'bg-red-50 border-red-300' : 
                         err === 'blue' ? 'bg-blue-50 border-blue-300' : 
                         err === 'orange' ? 'bg-amber-50 border-amber-300' : 'bg-ivory border-borderCustom';
              return (
                <div key={v.num} onClick={() => cycleError(v.num)} className={`p-3 rounded-2xl border transition cursor-pointer ${bg}`}>
                  <p className="quran-text text-sm">({v.num}) {v.text}</p>
                </div>
              );
            })}

            <button 
              onClick={handleSaveExam}
              className="w-full bg-emerald-deep text-white font-bold py-3 rounded-2xl text-xs mt-3 shadow-apple active:scale-95"
            >
              اعتماد النتيجة وترحيلها لولي الأمر
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
