      const [currentRole, setCurrentRole] = useState('super_admin');

        const saved = localStorage.getItem('almaher_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

        const saved = localStorage.getItem('almaher_approvals');
        return saved ? JSON.parse(saved) : INITIAL_APPROVALS;
      });

        "std-1": true,
        "std-2": true,
        "std-3": false,
        "std-4": true,
        "std-5": true
      });

      const showToast = (message, type = 'gold') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };

      useEffect(() => {
        localStorage.setItem('almaher_students', JSON.stringify(students));
      }, [students]);

        localStorage.setItem('almaher_approvals', JSON.stringify(approvals));
      }, [approvals]);

                    : toast.type === 'red'
                    ? 'bg-red-700 text-white'
                    : 'bg-white text-dark-text border border-gold-accent'
                }`}
              >
                <span>{toast.message}</span>
                <button onClick={() => setToasts(prev => prev.filter(t => t.id !== toast.id))} className="mr-2 text-xs opacity-75">✕</button>

            ))}
          </div>

                  <span className="text-[10px] text-gold-accent tracking-wider font-semibold uppercase">Al-Maher Platform</span>
                </div>
              </div>

              <select 
                value={currentRole} 
                onChange={(e) => {
                  setCurrentRole(e.target.value);
                  showToast(`تم التبديل إلى: ${rolesInfo[e.target.value].title}`, 'emerald');
                }}
                className="text-xs bg-emerald-light text-emerald-deep font-bold border border-emerald-deep/20 rounded-xl px-2.5 py-1.5 focus:outline-none"
              >
                <option value="super_admin">المشرف (المالك)</option>
                <option value="academic_director">المدير البيداغوجي</option>
                <option value="teacher">المدرس</option>
                <option value="examiner">الممتحن</option>
                <option value="parent">ولي الأمر</option>
              </select>
            </div>
          </header>

                approvals={approvals}
                setApprovals={setApprovals}

            {activeTab === 'exam' && <TabExamCenter students={students} setStudents={setStudents} setApprovals={setApprovals} showToast={showToast} />}

                { id: 'exam', label: 'التقييم', icon: 'exam' },

    // --- TAB 1: HOME ---
    function TabHome({ students, approvals, setApprovals, attendanceToday, setAttendanceToday, showToast }) {
      const toggleAttendance = (stdId, name) => {
        setAttendanceToday(prev => {
          const next = { ...prev, [stdId]: !prev[stdId] };
          showToast(`${name}: ${next[stdId] ? 'حاضر' : 'غائب'}`, next[stdId] ? 'emerald' : 'gold');
          return next;
        });
      };

      return (
        <div className="space-y-4">
          <div className="bg-gradient-to-l from-emerald-deep to-emerald-muted text-white rounded-3xl p-5 shadow-apple border border-gold-accent/40">
            <span className="text-gold-light text-xs font-semibold">مرحباً بك في المنصة</span>
            <h2 className="text-xl font-bold mt-1">الشيخ سمير دجاجة</h2>
            <p className="text-xs text-white/80 mt-1">حلقة الإتقان • جامع الفردوس</p>
          </div>

          <div className="bg-card rounded-3xl p-4 shadow-apple border border-borderCustom space-y-3">
            <h3 className="font-bold text-xs text-emerald-deep">تسجيل حضور حلقة اليوم:</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              {students.map(std => {
                const isAttended = attendanceToday[std.id];
                return (
                  <div 
                    key={std.id}
                    onClick={() => toggleAttendance(std.id, std.name)}
                    className={`p-2.5 rounded-2xl border transition cursor-pointer flex items-center justify-between ${
                      isAttended ? 'bg-emerald-light/50 border-emerald-deep/20 text-emerald-deep' : 'bg-red-50/60 border-red-200 text-red-700'
                    }`}
                  >
                    <span className="text-xs font-bold">{std.name}</span>
                    <span className="text-[11px] font-bold">{isAttended ? 'حاضر ✓' : 'غائب ✕'}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- TAB 2: CLASSES & TELEGRAM ---
    function TabClasses({ students, showToast }) {
      const msg = `🌟 حلقة التثبيت والمراجعة 🌟\nالموعد: اليوم بعد صلاة العصر\nالمكان: قاعة الإتقان 01\nيرجى إرسال فيديو التثبيت المنزلي.`;
      return (
        <div className="space-y-4">
          <div className="bg-card rounded-3xl p-5 shadow-apple border border-borderCustom space-y-3">
            <h3 className="font-bold text-xs text-emerald-deep">إعلان تيليجرام للحلقة</h3>
            <pre className="p-3 bg-emerald-light/40 rounded-2xl text-xs font-mono text-emerald-deep whitespace-pre-line leading-relaxed border border-emerald-muted/20">
              {msg}
            </pre>
            <button 
              onClick={() => {
                navigator.clipboard.writeText(msg);
                showToast("تم نسخ رسالة تيليجرام بنجاح!", "emerald");
              }}
              className="w-full bg-emerald-deep text-white font-bold py-2.5 rounded-xl text-xs transition"
            >
              نسخ الرسالة الجاهزة
            </button>
          </div>
        </div>
      );
    }

    // --- TAB 3: STUDENTS ---
    function TabStudents({ students, setStudents, showToast }) {
      const [filter, setFilter] = useState('all');
      const filtered = students.filter(s => filter === 'all' || s.groupType === filter);

      return (
        <div className="space-y-3">
          <div className="grid grid-cols-4 gap-1 text-center">
            {[{ id: 'all', label: 'الكل' }, { id: 'type1', label: 'موحدة' }, { id: 'type2', label: 'متقاربة' }, { id: 'type3', label: 'أحرار' }].map(f => (
              <button
                key={f.id}
                onClick={() => setFilter(f.id)}
                className={`py-2 text-xs font-bold rounded-xl border transition ${
                  filter === f.id ? 'bg-emerald-deep text-white border-emerald-deep' : 'bg-card text-dark-muted border-borderCustom'
                }`}
              >
                {f.label}
              </button>
            ))}
          </div>

          <div className="space-y-2">
            {filtered.map(std => (
              <div key={std.id} className="bg-card rounded-2xl p-3 border border-borderCustom shadow-sm flex items-center justify-between">
                <div>
                  <h4 className="font-bold text-xs text-emerald-deep">{std.name}</h4>
                  <span className="text-[10px] text-dark-muted">{std.surah} • حضور: {std.attendanceRate}%</span>
                </div>
                <span className="text-xs font-black text-emerald-deep bg-emerald-light px-2 py-1 rounded-lg">
                  {std.progressPages}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- TAB 4: EXAM EVALUATION ---
    function TabExamCenter({ students, setStudents, setApprovals, showToast }) {
      const [verseErrors, setVerseErrors] = useState({});
      const [selectedStudentId, setSelectedStudentId] = useState(students[0]?.id || "std-1");

      const score = useMemo(() => {
        let s = 100;
        Object.values(verseErrors).forEach(err => {
          if (err === 'red') s -= 10;
          if (err === 'blue') s -= 4;
          if (err === 'orange') s -= 2;
        });
        return Math.max(0, s);
      }, [verseErrors]);

      const cycleError = (verseNum) => {
        setVerseErrors(prev => {
          const current = prev[verseNum];
          const next = { ...prev };
          if (!current) next[verseNum] = 'red';
          else if (current === 'red') next[verseNum] = 'blue';
          else if (current === 'blue') next[verseNum] = 'orange';
          else delete next[verseNum];
          return next;
        });
      };

      return (
        <div className="space-y-4">
          <div className="bg-card rounded-3xl p-4 shadow-apple border border-borderCustom flex items-center justify-between">
            <select 
              value={selectedStudentId} 
              onChange={e => setSelectedStudentId(e.target.value)}
              className="bg-ivory border border-borderCustom rounded-xl p-2 text-xs font-bold text-emerald-deep"
            >
              {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <div className="text-center">
              <span className="text-[10px] text-dark-muted block">الدرجة المئوية</span>
              <span className="text-xl font-black text-emerald-deep">{score}%</span>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-4 shadow-apple border border-borderCustom space-y-2">
            <span className="text-[11px] text-dark-muted block mb-2 font-bold">المس الآية لتبديل حالة الخطأ (أحمر / أزرق / برتقالي):</span>
            {SURAH_AL_MULK.map(v => {
              const err = verseErrors[v.num];
              const bg = err === 'red' ? 'bg-red-50 border-red-300' : 
                         err === 'blue' ? 'bg-blue-50 border-blue-300' : 
                         err === 'orange' ? 'bg-amber-50 border-amber-300' : 'bg-ivory border-borderCustom';
              return (
                <div 
                  key={v.num} 
                  onClick={() => cycleError(v.num)}
                  className={`p-3 rounded-2xl border transition cursor-pointer ${bg}`}
                >
                  <p className="quran-font text-sm text-dark-text leading-relaxed">
                    ({v.num}) {v.text}
                  </p>
                </div>
              );
            })}

            <button 
              onClick={() => {
                showToast(`تم اعتماد النتيجة (${score}%) بنجاح!`, 'emerald');
                setVerseErrors({});
              }}
              className="w-full bg-emerald-deep text-white font-bold py-3 rounded-2xl text-xs mt-3 shadow-apple"
            >
              اعتماد النتيجة وترحيلها
            </button>
          </div>
        </div>
      );
    }

    // --- TAB 5: MORE ---
    function TabMore({ showToast }) {
      return (
        <div className="bg-card rounded-3xl p-5 shadow-apple border border-borderCustom space-y-3">
          <h3 className="font-bold text-xs text-emerald-deep">الأجندة والمواسم القرآنية</h3>
          <p className="text-xs text-dark-muted leading-relaxed">
            المنصة تضبط تلقائياً وتيرة الحفظ والتكرار حسب جدول العطلات والامتحانات المدرسية الرسمية.
          </p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
