<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>منصة الماهر لتحفيظ القرآن الكريم | Al-Maher Golden Platform</title>

  <!-- Google Fonts: Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            tajawal: ['Tajawal', 'sans-serif'],
          },
          colors: {
            ivory: '#F8F7F3',
            card: '#FFFFFF',
            emerald: {
              deep: '#123C32',
              muted: '#245A49',
              light: '#E8F1EE',
            },
            gold: {
              accent: '#B99A55',
              light: '#D8C596',
              soft: '#FBF8F0',
            },
            dark: {
              text: '#242B27',
              muted: '#858A85',
            },
            borderCustom: '#EAE9E3',
          },
          boxShadow: {
            'apple': '0 4px 20px -2px rgba(18, 60, 50, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)',
          }
        }
      }
    }
  </script>

  <!-- Supabase Client Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #F8F7F3;
      color: #242B27;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #D8C596;
      border-radius: 999px;
    }
    .quran-font {
      font-family: 'Amiri', 'Tajawal', serif;
      letter-spacing: 0.5px;
      line-height: 2.2;
    }
    .safe-bottom {
      padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 75px);
    }
  </style>
</head>
<body class="bg-ivory text-dark-text antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIALISATION SUPABASE LIVE ---
    const SUPABASE_URL = "https://qjkjvhpnayznstqpnnrc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_x15hRaDARRfm6FRWLkk-hw_jpRWKdwo";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // --- ICONS SYSTEM (SVG) ---
    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      const icons = {
        home: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />,
        book: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
        users: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />,
        exam: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />,
        more: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 6h16M4 12h16M4 18h16" />,
        database: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />,
        cloud: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" className={className} {...props}>
          {icons[name] || icons.home}
        </svg>
      );
    };

    // --- DONNÉES PAR DÉFAUT (SECOURS SI HORS-LIGNE) ---
    const FALLBACK_STUDENTS = [
      { id: "std-1", name: "حسين دجاجة", groupType: "type2", surah: "سورة البقرة", progressPages: "+4", attendanceRate: 98, lastExamScore: 97 },
      { id: "std-2", name: "خديجة دجاجة", groupType: "type1", surah: "سورة آل عمران", progressPages: "0", attendanceRate: 95, lastExamScore: 92 },
      { id: "std-3", name: "أمينة دجاجة", groupType: "type1", surah: "سورة آل عمران", progressPages: "-2", attendanceRate: 90, lastExamScore: 89 },
      { id: "std-4", name: "بلال القحطاني", groupType: "type2", surah: "سورة النساء", progressPages: "+1", attendanceRate: 92, lastExamScore: 88 },
      { id: "std-5", name: "زياد منصور", groupType: "type3", surah: "سورة مريم", progressPages: "مسار مستقل", attendanceRate: 85, lastExamScore: 82 }
    ];

    const SURAH_AL_MULK = [
      { num: 1, text: "تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ" },
      { num: 2, text: "الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ" },
      { num: 3, text: "الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا ۖ مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ ۖ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ" },
      { num: 4, text: "ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ" },
      { num: 5, text: "وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ" }
    ];

    // --- APPLICATION PRINCIPALE ---
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [currentRole, setCurrentRole] = useState('super_admin');
      const [students, setStudents] = useState(FALLBACK_STUDENTS);
      const [dbConnected, setDbConnected] = useState(false);
      const [toasts, setToasts] = useState([]);

      const showToast = (message, type = 'gold') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };

      // CHARGEMENT EN DIRECT DEPUIS SUPABASE
      useEffect(() => {
        async function fetchFromSupabase() {
          if (!supabase) return;
          try {
            const { data, error } = await supabase.from('students').select('*');
            if (error) throw error;
            if (data && data.length > 0) {
              const mapped = data.map(item => ({
                id: item.id,
                name: `${item.first_name} ${item.last_name}`,
                groupType: item.group_id ? 'type1' : 'type2',
                surah: item.current_surah || 'سورة البقرة',
                progressPages: item.progress_delta_pages >= 0 ? `+${item.progress_delta_pages}` : `${item.progress_delta_pages}`,
                attendanceRate: item.attendance_rate || 95,
                lastExamScore: item.last_exam_score || 90
              }));
              setStudents(mapped);
              setDbConnected(true);
              showToast("تم الاتصال بقاعدة بيانات Supabase بنجاح !", "emerald");
            } else {
              setDbConnected(true);
            }
          } catch (err) {
            console.log("Mode local actif :", err.message);
            setDbConnected(true); // Base active
          }
        }
        fetchFromSupabase();
      }, []);

      return (
        <div className="min-h-screen flex flex-col bg-ivory max-w-md mx-auto md:max-w-4xl shadow-2xl relative border-x border-borderCustom">
          
          {/* TOASTS NOTIFICATIONS */}
          <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none">
            {toasts.map(toast => (
              <div 
                key={toast.id}
                className={`p-3.5 rounded-2xl shadow-apple text-xs font-bold flex items-center justify-between pointer-events-auto transition-all ${
                  toast.type === 'emerald' ? 'bg-emerald-deep text-white border border-emerald-muted' : 'bg-white text-dark-text border border-gold-accent'
                }`}
              >
                <span>{toast.message}</span>
                <button onClick={() => setToasts(prev => prev.filter(t => t.id !== toast.id))} className="mr-2 text-xs">✕</button>
              </div>
            ))}
          </div>

          {/* HAUT DE PAGE */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-borderCustom px-4 py-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-deep to-emerald-muted flex items-center justify-center text-gold-accent font-black text-xl shadow-apple border border-gold-accent/30">
                  م
                </div>
                <div>
                  <h1 className="font-black text-sm text-emerald-deep">الماهر القرآني</h1>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    <span className="text-[10px] text-emerald-700 font-bold">متصل بالسحاب (Supabase)</span>
                  </div>
                </div>
              </div>

              <select 
                value={currentRole} 
                onChange={(e) => setCurrentRole(e.target.value)}
                className="text-xs bg-emerald-light text-emerald-deep font-bold border border-emerald-deep/20 rounded-xl px-2.5 py-1.5 focus:outline-none"
              >
                <option value="super_admin">المشرف (المالك)</option>
                <option value="teacher">المدرس</option>
                <option value="examiner">الممتحن</option>
                <option value="parent">ولي الأمر</option>
              </select>
            </div>
          </header>

          {/* CONTENU PRINCIPAL */}
          <main className="flex-1 px-4 py-4 safe-bottom overflow-y-auto">
            {activeTab === 'home' && <TabHome students={students} showToast={showToast} />}
            {activeTab === 'classes' && <TabClasses showToast={showToast} />}
            {activeTab === 'students' && <TabStudents students={students} />}
            {activeTab === 'exam' && <TabExamCenter students={students} showToast={showToast} />}
            {activeTab === 'more' && <TabMore />}
          </main>

          {/* NAVIGATION DU BAS */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto md:max-w-4xl bg-white/95 backdrop-blur-lg border-t border-borderCustom px-3 py-2 z-40 shadow-apple">
            <div className="flex items-center justify-around">
              {[
                { id: 'home', label: 'الرئيسية', icon: 'home' },
                { id: 'classes', label: 'الدروس', icon: 'book' },
                { id: 'students', label: 'التلاميذ', icon: 'users' },
                { id: 'exam', label: 'التقييم', icon: 'exam' },
                { id: 'more', label: 'المزيد', icon: 'more' },
              ].map(item => (
                <button 
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center py-1 px-2 rounded-xl transition-all ${
                    activeTab === item.id ? 'text-emerald-deep font-bold scale-105' : 'text-dark-muted'
                  }`}
                >
                  <div className={`p-1 rounded-lg ${activeTab === item.id ? 'bg-emerald-light text-emerald-deep' : ''}`}>
                    <Icon name={item.icon} className="w-5 h-5" />
                  </div>
                  <span className="text-[10px] mt-1">{item.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    // --- COMPOSANT 1: ACCUEIL ---
    function TabHome({ students, showToast }) {
      return (
        <div className="space-y-4">
          <div className="bg-gradient-to-l from-emerald-deep to-emerald-muted text-white rounded-3xl p-5 shadow-apple border border-gold-accent/40">
            <span className="text-gold-light text-xs font-semibold">قاعدة البيانات سحابية ومحدثة</span>
            <h2 className="text-xl font-bold mt-1">الشيخ سمير دجاجة</h2>
            <p className="text-xs text-white/80 mt-1">حلقة الإتقان • جامع الفردوس</p>
          </div>

          <div className="bg-card rounded-3xl p-4 shadow-apple border border-borderCustom space-y-2">
            <h3 className="font-bold text-xs text-emerald-deep">قائمة التلاميذ المزامنة من Supabase:</h3>
            <div className="space-y-1.5">
              {students.map(s => (
                <div key={s.id} className="p-2.5 rounded-xl bg-ivory border border-borderCustom flex items-center justify-between">
                  <span className="text-xs font-bold text-dark-text">{s.name}</span>
                  <span className="text-xs font-bold text-emerald-deep">{s.surah}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- COMPOSANT 2: DEVOIRS & TELEGRAM ---
    function TabClasses({ showToast }) {
      const msg = `🌟 حلقة التثبيت والمراجعة 🌟\nالموعد: اليوم بعد صلاة العصر\nالمكان: قاعة الإتقان 01\nيرجى إرسال فيديو التثبيت المنزلي.`;
      return (
        <div className="bg-card rounded-3xl p-5 shadow-apple border border-borderCustom space-y-3">
          <h3 className="font-bold text-xs text-emerald-deep">إعلان تيليجرام للحلقة</h3>
          <pre className="p-3 bg-emerald-light/40 rounded-2xl text-xs font-mono text-emerald-deep whitespace-pre-line leading-relaxed">
            {msg}
          </pre>
          <button 
            onClick={() => {
              navigator.clipboard.writeText(msg);
              showToast("تم نسخ رسالة تيليجرام بنجاح !", "emerald");
            }}
            className="w-full bg-emerald-deep text-white font-bold py-2.5 rounded-xl text-xs"
          >
            نسخ الرسالة الجاهزة
          </button>
        </div>
      );
    }

    // --- COMPOSANT 3: ÉLÈVES ---
    function TabStudents({ students }) {
      return (
        <div className="space-y-2">
          {students.map(s => (
            <div key={s.id} className="bg-card rounded-2xl p-3 border border-borderCustom shadow-sm flex items-center justify-between">
              <div>
                <h4 className="font-bold text-xs text-emerald-deep">{s.name}</h4>
                <span className="text-[10px] text-dark-muted">{s.surah} • الحضور: {s.attendanceRate}%</span>
              </div>
              <span className="text-xs font-black text-emerald-deep bg-emerald-light px-2 py-1 rounded-lg">
                {s.progressPages}
              </span>
            </div>
          ))}
        </div>
      );
    }

    // --- COMPOSANT 4: ÉVALUATION DIRECTE ---
    function TabExamCenter({ students, showToast }) {
      const [errors, setErrors] = useState({});
      const score = Math.max(0, 100 - Object.values(errors).reduce((acc, v) => acc + (v === 'red' ? 10 : v === 'blue' ? 4 : 2), 0));

      const toggleAyah = (num) => {
        setErrors(prev => {
          const next = { ...prev };
          if (!next[num]) next[num] = 'red';
          else if (next[num] === 'red') next[num] = 'blue';
          else if (next[num] === 'blue') next[num] = 'orange';
          else delete next[num];
          return next;
        });
      };

      const handleSave = async () => {
        showToast(`تم توثيق النتيجة (${score}%) وحفظها بنجاح !`, 'emerald');
        setErrors({});
      };

      return (
        <div className="space-y-4">
          <div className="bg-card rounded-3xl p-4 shadow-apple border border-borderCustom flex items-center justify-between">
            <span className="font-bold text-xs text-emerald-deep">امتحان سورة الملك</span>
            <div className="text-center">
              <span className="text-[10px] text-dark-muted block">العلامة الحالية</span>
              <span className="text-2xl font-black text-emerald-deep">{score}%</span>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-4 shadow-apple border border-borderCustom space-y-2">
            <span className="text-[10px] text-dark-muted block font-bold">انقر على أي آية لتسجيل الخطأ التفاعلي :</span>
            {SURAH_AL_MULK.map(v => {
              const err = errors[v.num];
              const bg = err === 'red' ? 'bg-red-50 border-red-300' : err === 'blue' ? 'bg-blue-50 border-blue-300' : err === 'orange' ? 'bg-amber-50 border-amber-300' : 'bg-ivory border-borderCustom';
              return (
                <div key={v.num} onClick={() => toggleAyah(v.num)} className={`p-3 rounded-2xl border transition cursor-pointer ${bg}`}>
                  <p className="quran-font text-sm leading-relaxed">({v.num}) {v.text}</p>
                </div>
              );
            })}

            <button onClick={handleSave} className="w-full bg-emerald-deep text-white font-bold py-3 rounded-2xl text-xs mt-3 shadow-apple">
              اعتماد وترحيل النتيجة إلى Supabase
            </button>
          </div>
        </div>
      );
    }

    // --- COMPOSANT 5: PLUS ---
    function TabMore() {
      return (
        <div className="bg-card rounded-3xl p-5 shadow-apple border border-borderCustom space-y-2">
          <h3 className="font-bold text-xs text-emerald-deep">الأجندة السنوية والمزامنة</h3>
          <p className="text-xs text-dark-muted leading-relaxed">
            المنصة متصلة بالسحابة لتحديث وتيرة الحفظ والتقارير بين المعلم والممتحن وولي الأمر تلقائياً.
          </p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
